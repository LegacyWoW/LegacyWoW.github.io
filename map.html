<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LegacyWoW — World Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --bg:#0b0b0b;
      --border: rgba(255,255,255,.14);
      --text:#e8e8e8;
    }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header{
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: #070707;
    }
    .wrap{ max-width:1100px; margin:0 auto; padding:0 18px; }
    .toprow{
      display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    }
    .brand{
      display:flex; align-items:center; gap:12px; text-decoration:none; color:#fff;
      font-weight:900; letter-spacing:.4px;
    }
    .logo{
      width:40px; height:40px; border-radius:12px; overflow:hidden;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.04);
      display:flex; align-items:center; justify-content:center;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:block; }

    nav{ display:flex; gap:10px; flex-wrap:wrap; }
    nav a{
      color:#fff; text-decoration:none; font-weight:800; font-size:13px;
      padding:10px 12px; border-radius:14px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.04);
    }
    nav a:hover{ background: rgba(255,255,255,.10); }

    .shell{
      position: relative;
      width: 100%;
      background: #111;
    }

    .world-map-section{
      position: relative;
      width: 100%;
      height: 80vh;
      min-height: 600px;
      background: #000;
      overflow: hidden;
    }

    .world-map-section .leaflet-container{
      width: 100%;
      height: 100%;
      background: #000;
    }

    .world-map-section .map-label{
      position:absolute;
      top:16px;
      left:16px;
      z-index:1000;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.65);
      color:#fff;
      font-weight:900;
      pointer-events:none;
    }

    .world-map-section .leaflet-control-zoom a{
      background:rgba(0,0,0,.75) !important;
      color:#fff !important;
      border-color:rgba(255,255,255,.20) !important;
    }

    .world-map-section .leaflet-control-zoom a:hover{
      background:rgba(255,255,255,.18) !important;
    }

    .current-map{
      position: relative;
      width: 100%;
    }

    #map{
      height: calc(100vh - 72px);
      min-height: 560px;
      width: 100%;
      background: #111;
    }

    /* Admin-only top-right bar */
    .adminbar{
      position:absolute;
      top:16px;
      right:16px;
      z-index: 999;
      display:flex;
      gap:10px;
      align-items:center;
      padding:10px;
      border-radius:14px;
      border:1px solid var(--border);
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }
    .btn{
      border:1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color:#fff;
      border-radius:12px;
      padding:10px 12px;
      font-weight:900;
      cursor:pointer;
      font-size:13px;
    }
    .btn:hover{ background: rgba(255,255,255,.12); }

    /* ✅ IMPORTANT: don't wipe Leaflet-draw icons */
    .leaflet-control a{
      background-color: rgba(0,0,0,.55) !important;
      color:#fff !important;
      border-color: rgba(255,255,255,.14) !important;
    }
    .leaflet-control a:hover{ background-color: rgba(0,0,0,.75) !important; }

    .leaflet-popup-content-wrapper, .leaflet-popup-tip{
      background: rgba(0,0,0,.80);
      color:#fff;
      border:1px solid rgba(255,255,255,.12);
    }
  </style>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- Leaflet.draw -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
</head>

<body>
  <header>
    <div class="wrap toprow">
      <a class="brand" href="index.html">
        <div class="logo">
          <img src="/assets/logo.png" alt="LegacyWoW" onerror="this.remove();" />
        </div>
        <div>LegacyWoW — World Map</div>
      </a>

      <nav>
        <a href="index.html">Home</a>
        <a href="how-to-play.html">How to Play</a>
        <a href="news.html">News</a>
        <a href="rules.html">Rules</a>
        <a href="faq.html">FAQ</a>
        <a href="map.html">Map</a>
      </nav>
    </div>
  </header>

  <div class="shell">

    <!-- Northrend -->
    <div class="world-map-section" id="northrendMap">
      <div class="map-label">Northrend</div>
    </div>

    <!-- Existing interactive Azeroth map -->
    <div class="current-map">
      <div id="map"></div>

      <!-- Admin-only controls (hidden unless ?admin=1) -->
      <div class="adminbar" id="adminBar">
        <button class="btn" id="exportBtn">Export</button>
        <button class="btn" id="clearBtn">Clear</button>
      </div>
    </div>

    <!-- Outland -->
    <div class="world-map-section" id="outlandMap">
      <div class="map-label">Outland</div>
    </div>

  </div>

  <!-- Keep the existing Azeroth map exactly as it was -->
  <script src="/map/app.js"></script>

  <script>
    // Additional maps use Leaflet's simple-image coordinate system.
    // Relative image paths work on both a custom domain and GitHub Pages.
    function createWorldMap(elementId, imagePath, width, height) {
      const container = document.getElementById(elementId);

      const map = L.map(container, {
        crs: L.CRS.Simple,
        center: [height / 2, width / 2],
        zoom: 0,
        minZoom: -3,
        maxZoom: 5,
        zoomControl: true,
        scrollWheelZoom: true,
        doubleClickZoom: true,
        dragging: true,
        touchZoom: true,
        boxZoom: true,
        keyboard: true,
        attributionControl: false
      });

      const bounds = [[0, 0], [height, width]];

      L.imageOverlay(imagePath, bounds, {
        opacity: 1,
        interactive: false
      }).addTo(map);

      map.fitBounds(bounds, { padding: [20, 20] });

      // Keep the entire map reasonably close while still allowing zooming.
      map.setMaxBounds([
        [-height * 0.5, -width * 0.5],
        [height * 1.5, width * 1.5]
      ]);

      // Make sure Leaflet recalculates the container after the page loads.
      setTimeout(() => {
        map.invalidateSize();
        map.fitBounds(bounds, { padding: [20, 20] });
      }, 100);

      return map;
    }

    const northrendMap = createWorldMap(
      "northrendMap",
      "map/Northrend.png",
      1073,
      878
    );

    const outlandMap = createWorldMap(
      "outlandMap",
      "map/outland.png",
      779,
      763
    );

    window.addEventListener("resize", () => {
      northrendMap.invalidateSize();
      outlandMap.invalidateSize();
    });

    const isAdmin = new URLSearchParams(location.search).get("admin") === "1";
    const adminBar = document.getElementById("adminBar");
    if (!isAdmin && adminBar) adminBar.style.display = "none";
  </script>
</body>
</html>
